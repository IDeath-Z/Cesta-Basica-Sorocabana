# Spring Configuration
spring.application.name=cesta_basica_sorocabana
spring.config.import=optional:file:.env[.properties]
spring.aop.proxy-target-class=false

# Token hash
jwt.secret=${JWT_SECRET}
jwt.issuer=cesta_basica_api
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Initial admin (created on the first startup with every permission, password changed later through the API)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.role-name=${ADMIN_ROLE_NAME:ADMIN}

# API base path for every controller
app.api.base-path=/api/v1

# Locale: validation messages
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Swagger config
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# CORS configuration
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
